description: Telink TLSR8258 UART

compatible: "telink,tlsr8258-uart"

include: [uart-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true
    description: |
      System clock the baud rate divider is derived from; its clock-frequency
      is what the driver divides.

  tx-pin:
    type: int
    required: true
    description: Vendor GPIO pin value used for UART TX.

  rx-pin:
    type: int
    description: Vendor GPIO pin value used for UART RX.
