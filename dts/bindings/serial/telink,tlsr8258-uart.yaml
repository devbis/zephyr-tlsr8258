# SPDX-License-Identifier: Apache-2.0

description: Telink TLSR8258 UART

compatible: "telink,tlsr8258-uart"

include: uart-controller.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clock-frequency:
    required: true

  tx-pin:
    type: int
    required: true
    description: Vendor GPIO pin value used for UART TX.

  rx-pin:
    type: int
    description: Vendor GPIO pin value used for UART RX.
