description: Telink TLSR8258 timer2-based watchdog

compatible: "telink,tlsr8258-watchdog"

include: base.yaml

properties:
  reg:
    required: true

  clock-frequency:
    type: int
    required: true
    description: Rate of the timer2 tick that the watchdog compares against, in Hz.
