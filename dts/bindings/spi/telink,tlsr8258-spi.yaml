description: Telink TLSR8258 SPI master controller

compatible: "telink,tlsr8258-spi"

include: [spi-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true
    description: |
      System clock the SPI divider is derived from. The SPI clock is
      system clock / (2 * (div + 1)).
