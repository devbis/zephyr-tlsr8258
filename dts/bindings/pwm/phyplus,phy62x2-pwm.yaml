description: |
  Phyplus PHY62x2 PWM controller. Six channels with an up counter of 16 bits. The channels
  share the prescaler. The pads are the PHY62X2_FMUX_PWM0 to PHY62X2_FMUX_PWM5 functions of the
  pinctrl state.

compatible: "phyplus,phy62x2-pwm"

include: [pwm-controller.yaml, pinctrl-device.yaml, base.yaml]

properties:
  reg:
    required: true

  "#pwm-cells":
    const: 3

  clock-frequency:
    type: int
    default: 16000000
    description: |
      Clock of the counters before the prescaler, in Hz. 16 MHz is assumed: the SDK does not give it.

  prescaler:
    type: int
    default: 0
    enum: [0, 1, 2, 3, 4, 5, 6, 7]
    description: |
      The counter clock is clock-frequency divided by 2 to the power of this value.

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

pwm-cells:
  - channel
  - period
  - flags
