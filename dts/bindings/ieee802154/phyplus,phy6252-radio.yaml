description: Phyplus PHY6252 IEEE 802.15.4 radio

compatible: "phyplus,phy6252-radio"

include: base.yaml

properties:
  reg:
    required: true
    description: RF, link-layer, TX FIFO, and RX FIFO register windows.

  interrupts:
    required: true
    description: Baseband and link-layer radio interrupt.
