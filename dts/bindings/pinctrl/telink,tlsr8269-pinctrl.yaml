description: Telink TLSR8269 pin controller

compatible: "telink,tlsr8269-pinctrl"

include: base.yaml

child-binding:
  description: TLSR8269 pin control state

  include:
    - name: pincfg-node.yaml
      property-allowlist:
        - bias-disable
        - bias-pull-down
        - bias-pull-up
        - input-enable
        - output-enable

  properties:
    pinmux:
      required: true
      type: int
      description: TLSR8269_PINMUX(pin, function) value.
