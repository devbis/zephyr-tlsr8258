description: |
  Phyplus PHY62x2 DMA controller, a DesignWare AHB one with four channels. The channel 0 moves
  blocks of up to 2047 transfers, the others up to 31.

compatible: "phyplus,phy62x2-dma"

include: dma-controller.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  "#dma-cells":
    const: 2

dma-cells:
  - channel
  - slot
