name: Build Zigbee firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - zigbee-generic-stack

permissions:
  contents: read

concurrency:
  group: zigbee-firmware-${{ github.ref }}
  cancel-in-progress: false

env:
  TC32_TOOLCHAIN_VERSION: 23.1.2-tc32-20261002
  ARM_GNU_TOOLCHAIN_VERSION: 15.3.rel1
  RELEASE_TAG_PREFIX: zephyr-zigbee
  STM32CUBEWB_VERSION: 1.24.0
  # SHA-256 of the STM32WB5x wireless coprocessor binaries of that STM32CubeWB release
  STM32WB_RCP_SHA256: c113601f52f665556c372dd147da5ff413a573c9113ddb835eef0df2125039ec
  STM32WB_FUS_SHA256: bbab9b42d92c31f8a04e2f04ef9361c3f6f01714c14408cd34fb1583a6edf30d

jobs:
  build-firmware:
    name: ${{ matrix.soc }} / ${{ matrix.role }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - soc: tlsr8258
            board: tlsr8258_tb03f/tlsr8258
            role: router
            role_symbol: CONFIG_ZIGBEE_ROUTER
            toolchain_variant: host
          - soc: tlsr8258
            board: tlsr8258_tb03f/tlsr8258
            role: end-device
            role_symbol: CONFIG_ZIGBEE_ED
            toolchain_variant: host
          - soc: tlsr8258
            board: tlsr8258_tb03f/tlsr8258
            role: coordinator
            role_symbol: CONFIG_ZIGBEE_COORDINATOR
            toolchain_variant: host
          - soc: nrf52840
            board: nrf52840dk/nrf52840
            role: router
            role_symbol: CONFIG_ZIGBEE_ROUTER
            toolchain_variant: gnuarmemb
          - soc: nrf52840
            board: nrf52840dk/nrf52840
            role: end-device
            role_symbol: CONFIG_ZIGBEE_ED
            toolchain_variant: gnuarmemb
          - soc: nrf52840
            board: nrf52840dk/nrf52840
            role: coordinator
            role_symbol: CONFIG_ZIGBEE_COORDINATOR
            toolchain_variant: gnuarmemb
          - soc: nrf52840_nicenano
            board: promicro_nrf52840/nrf52840/uf2
            role: router
            role_symbol: CONFIG_ZIGBEE_ROUTER
            toolchain_variant: gnuarmemb
          - soc: nrf52840_nicenano
            board: promicro_nrf52840/nrf52840/uf2
            role: end-device
            role_symbol: CONFIG_ZIGBEE_ED
            toolchain_variant: gnuarmemb
          - soc: nrf52840_nicenano
            board: promicro_nrf52840/nrf52840/uf2
            role: coordinator
            role_symbol: CONFIG_ZIGBEE_COORDINATOR
            toolchain_variant: gnuarmemb
          - soc: efr32mg21
            board: slwrb4180a
            role: router
            role_symbol: CONFIG_ZIGBEE_ROUTER
            toolchain_variant: gnuarmemb
          - soc: efr32mg21
            board: slwrb4180a
            role: end-device
            role_symbol: CONFIG_ZIGBEE_ED
            toolchain_variant: gnuarmemb
          - soc: efr32mg21
            board: slwrb4180a
            role: coordinator
            role_symbol: CONFIG_ZIGBEE_COORDINATOR
            toolchain_variant: gnuarmemb
          - soc: esp32h2
            board: esp32h2_devkitm/esp32h2
            role: router
            role_symbol: CONFIG_ZIGBEE_ROUTER
            toolchain_variant: zephyr
          - soc: esp32h2
            board: esp32h2_devkitm/esp32h2
            role: end-device
            role_symbol: CONFIG_ZIGBEE_ED
            toolchain_variant: zephyr
          - soc: esp32h2
            board: esp32h2_devkitm/esp32h2
            role: coordinator
            role_symbol: CONFIG_ZIGBEE_COORDINATOR
            toolchain_variant: zephyr
          - soc: esp32c6
            board: esp32c6_devkitc/esp32c6/hpcore
            role: router
            role_symbol: CONFIG_ZIGBEE_ROUTER
            toolchain_variant: zephyr
          - soc: esp32c6
            board: esp32c6_devkitc/esp32c6/hpcore
            role: end-device
            role_symbol: CONFIG_ZIGBEE_ED
            toolchain_variant: zephyr
          - soc: esp32c6
            board: esp32c6_devkitc/esp32c6/hpcore
            role: coordinator
            role_symbol: CONFIG_ZIGBEE_COORDINATOR
            toolchain_variant: zephyr
          - soc: bl702
            board: dt_xt_zb1_devkit
            role: router
            role_symbol: CONFIG_ZIGBEE_ROUTER
            toolchain_variant: zephyr
          - soc: bl702
            board: dt_xt_zb1_devkit
            role: end-device
            role_symbol: CONFIG_ZIGBEE_ED
            toolchain_variant: zephyr
          - soc: bl702
            board: dt_xt_zb1_devkit
            role: coordinator
            role_symbol: CONFIG_ZIGBEE_COORDINATOR
            toolchain_variant: zephyr
          - soc: phy6252
            board: pb_03f
            role: router
            role_symbol: CONFIG_ZIGBEE_ROUTER
            toolchain_variant: gnuarmemb
          - soc: phy6252
            board: pb_03f
            role: end-device
            role_symbol: CONFIG_ZIGBEE_ED
            toolchain_variant: gnuarmemb
          - soc: phy6252
            board: pb_03f
            role: coordinator
            role_symbol: CONFIG_ZIGBEE_COORDINATOR
            toolchain_variant: gnuarmemb
          - soc: stm32wba
            board: nucleo_wba55cg
            role: router
            role_symbol: CONFIG_ZIGBEE_ROUTER
            toolchain_variant: gnuarmemb
          - soc: stm32wba
            board: nucleo_wba55cg
            role: end-device
            role_symbol: CONFIG_ZIGBEE_ED
            toolchain_variant: gnuarmemb
          - soc: stm32wba
            board: nucleo_wba55cg
            role: coordinator
            role_symbol: CONFIG_ZIGBEE_COORDINATOR
            toolchain_variant: gnuarmemb
          - soc: stm32wb55
            board: weact_stm32wb55_core
            role: router
            role_symbol: CONFIG_ZIGBEE_ROUTER
            toolchain_variant: gnuarmemb
          - soc: stm32wb55
            board: weact_stm32wb55_core
            role: end-device
            role_symbol: CONFIG_ZIGBEE_ED
            toolchain_variant: gnuarmemb
          - soc: stm32wb55
            board: weact_stm32wb55_core
            role: coordinator
            role_symbol: CONFIG_ZIGBEE_COORDINATOR
            toolchain_variant: gnuarmemb
          - soc: ecb02c
            board: ecb02c
            role: router
            role_symbol: CONFIG_ZIGBEE_ROUTER
            toolchain_variant: gnuarmemb
          - soc: ecb02c
            board: ecb02c
            role: end-device
            role_symbol: CONFIG_ZIGBEE_ED
            toolchain_variant: gnuarmemb
          - soc: ecb02c
            board: ecb02c
            role: coordinator
            role_symbol: CONFIG_ZIGBEE_COORDINATOR
            toolchain_variant: gnuarmemb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-base.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake device-tree-compiler g++ gcc gperf make ninja-build \
            python3-dev xz-utils
          python -m pip install -r scripts/requirements-base.txt

      - name: Initialize west workspace
        run: |
          git config --global http.version HTTP/1.1
          west init -l .
          west config manifest.group-filter -- +ci,-optional
          west update -o=--depth=1 -n || west update -o=--depth=1 -n
          west zephyr-export

      - name: Install the MCUboot image tool dependencies
        if: matrix.soc == 'stm32wb55' || matrix.soc == 'ecb02c'
        run: |
          # imgtool signs the application and needs its own Python packages
          python -m pip install -r ../bootloader/mcuboot/scripts/requirements.txt

      - name: Install Espressif build dependencies
        if: matrix.soc == 'esp32h2' || matrix.soc == 'esp32c6'
        run: |
          west packages pip --install --ignore-venv-check
          west blobs fetch hal_espressif

      - name: Install TC32 LLVM toolchain
        if: matrix.soc == 'tlsr8258'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tc32-llvm-toolchain.tar.gz"
          install_dir="$RUNNER_TEMP/tc32-llvm-toolchain"
          url="https://github.com/modern-tc32/llvm-project/releases/download/${TC32_TOOLCHAIN_VERSION}/tc32-llvm-toolchain-linux-amd64.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          clang_path="$(find "$install_dir" \( -type f -o -type l \) \
            -path '*/bin/clang' -print -quit)"
          if [[ -z "$clang_path" ]]; then
            echo "clang was not found in the TC32 toolchain archive" >&2
            exit 1
          fi
          toolchain_path="${clang_path%/bin/clang}"
          test -x "$toolchain_path/bin/ld.lld"
          echo "LLVM_TOOLCHAIN_PATH=$toolchain_path" >> "$GITHUB_ENV"
          echo "$toolchain_path/bin" >> "$GITHUB_PATH"
          "$toolchain_path/bin/clang" --version

      - name: Fetch Silicon Labs binary blobs
        if: matrix.soc == 'efr32mg21'
        run: |
          west blobs fetch hal_silabs

      - name: Fetch STMicroelectronics binary blobs
        if: matrix.soc == 'stm32wba'
        run: |
          west blobs fetch hal_stm32

      - name: Fetch Bouffalo Lab binary blobs
        if: matrix.soc == 'bl702'
        run: |
          west blobs fetch hal_bouffalolab

      - name: Install Arm GNU Toolchain
        if: matrix.soc == 'nrf52840' || matrix.soc == 'nrf52840_nicenano' || matrix.soc == 'efr32mg21' || matrix.soc == 'phy6252' || matrix.soc == 'stm32wba' || matrix.soc == 'stm32wb55' || matrix.soc == 'ecb02c'
        shell: bash
        run: |
          set -euo pipefail
          archive_name="arm-gnu-toolchain-${ARM_GNU_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi.tar.xz"
          archive="$RUNNER_TEMP/$archive_name"
          install_dir="$RUNNER_TEMP/arm-gnu-toolchain"
          url="https://gitlab.arm.com/api/v4/projects/10698/packages/generic/gnu-toolchain/${ARM_GNU_TOOLCHAIN_VERSION}/${archive_name}"
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
          mkdir -p "$install_dir"
          tar -xJf "$archive" --strip-components=1 -C "$install_dir"
          test -x "$install_dir/bin/arm-none-eabi-gcc"
          echo "GNUARMEMB_TOOLCHAIN_PATH=$install_dir" >> "$GITHUB_ENV"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          "$install_dir/bin/arm-none-eabi-gcc" --version

      - name: Install Zephyr SDK
        if: matrix.soc == 'esp32h2' || matrix.soc == 'esp32c6' || matrix.soc == 'bl702'
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/zephyr-sdk"
          west sdk install \
            --install-dir "$install_dir" \
            --gnu-toolchains riscv64-zephyr-elf
          echo "ZEPHYR_SDK_INSTALL_DIR=$install_dir" >> "$GITHUB_ENV"

      - name: Install BL702 image packer
        if: matrix.soc == 'bl702'
        shell: bash
        run: |
          set -euo pipefail
          tool_venv="$RUNNER_TEMP/bflb-mcu-tool"
          python -m venv "$tool_venv"
          "$tool_venv/bin/python" -m pip install --disable-pip-version-check 'bflb-mcu-tool==1.10.0'
          echo "BFLB_MCU_TOOL_PYTHON=$tool_venv/bin/python" >> "$GITHUB_ENV"

      - name: Build firmware
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
          ROLE: ${{ matrix.role }}
          ROLE_SYMBOL: ${{ matrix.role_symbol }}
          SOC: ${{ matrix.soc }}
          ZEPHYR_BASE: ${{ github.workspace }}
          ZEPHYR_TOOLCHAIN_VARIANT: ${{ matrix.toolchain_variant }}
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/build-${SOC}-${ROLE}"
          cmake_args=()

          case "$ROLE" in
            router)
              if [[ "$SOC" == nrf52840_nicenano ]]; then
                cmake_args+=(
                  '-DEXTRA_CONF_FILE=router.conf;promicro_usb_shell.conf'
                  -DEXTRA_DTC_OVERLAY_FILE=promicro_nosd.overlay
                  -DCONFIG_ZIGBEE_STACK_SIZE=4096
                )
              else
                cmake_args+=(-DEXTRA_CONF_FILE=router.conf)
              fi
              # The router does not fit into the 128 KiB of flash with logging.
              if [[ "$SOC" == phy6252 ]]; then
                cmake_args+=(-DCONFIG_LOG=n)
              fi
              ;;
            end-device)
              cmake_args+=(-DCONFIG_ZIGBEE_ED=y)
              if [[ "$SOC" == nrf52840_nicenano ]]; then
                cmake_args+=(
                  '-DEXTRA_CONF_FILE=promicro_usb_shell.conf;promicro_ed_usb.conf'
                  '-DEXTRA_DTC_OVERLAY_FILE=promicro_nosd.overlay;promicro_ed_usb.overlay'
                )
              fi
              # Deep sleep is implemented for the TLSR8258 and the BL702 only.
              if [[ "$SOC" == tlsr8258 || "$SOC" == bl702 ]]; then
                cmake_args+=(-DEXTRA_CONF_FILE=sleepy_deep.conf)
              fi
              ;;
            coordinator)
              if [[ "$SOC" == nrf52840_nicenano ]]; then
                cmake_args+=(
                  '-DEXTRA_CONF_FILE=coordinator_znp.conf;promicro_znp_usb.conf'
                  '-DEXTRA_DTC_OVERLAY_FILE=promicro_nosd.overlay;promicro_znp_usb.overlay'
                )
              elif [[ "$SOC" == stm32wb55 ]]; then
                # The host talks to the first USB CDC port of the board.
                cmake_args+=(
                  "-DEXTRA_CONF_FILE=coordinator_znp.conf;coordinator_znp_weact_stm32wb55_core.conf"
                  "-DEXTRA_DTC_OVERLAY_FILE=$ZEPHYR_BASE/samples/zigbee/zigbee_shell/coordinator_znp_weact_stm32wb55_core.overlay"
                )
              elif [[ "$SOC" == ecb02c ]]; then
                # The host talks to UART1, the USB-UART of the module on P2 and P3.
                cmake_args+=(
                  "-DEXTRA_CONF_FILE=coordinator_znp.conf;coordinator_znp_ecb02c.conf"
                  "-DEXTRA_DTC_OVERLAY_FILE=$ZEPHYR_BASE/samples/zigbee/zigbee_shell/coordinator_znp_ecb02c.overlay"
                )
              else
                cmake_args+=(-DEXTRA_CONF_FILE=coordinator_znp.conf)
              fi
              if [[ "$SOC" == efr32mg21 ]]; then
                cmake_args+=("-DEXTRA_DTC_OVERLAY_FILE=$ZEPHYR_BASE/samples/zigbee/zigbee_shell/coordinator_znp_slwrb4180a.overlay")
              fi
              if [[ "$SOC" == bl702 ]]; then
                cmake_args+=("-DEXTRA_DTC_OVERLAY_FILE=$ZEPHYR_BASE/samples/zigbee/zigbee_shell/coordinator_znp_dt_xt_zb1_devkit.overlay")
              fi
              if [[ "$SOC" == phy6252 ]]; then
                cmake_args+=("-DEXTRA_DTC_OVERLAY_FILE=$ZEPHYR_BASE/samples/zigbee/zigbee_shell/coordinator_znp_pb_03f.overlay")
              fi
              ;;
            *)
              echo "Unknown Zigbee role: $ROLE" >&2
              exit 1
              ;;
          esac

          if [[ "$SOC" == stm32wb55 ]]; then
            # router.conf and coordinator_znp.conf lower the stack of the Zigbee thread; the
            # USB console and the logging of this board need the larger one.
            cmake_args+=(-DCONFIG_ZIGBEE_STACK_SIZE=4096)
          fi

          if [[ "$SOC" == tlsr8258 ]]; then
            cmake_args+=(
              -DTOOLCHAIN_VARIANT_COMPILER=llvm
              "-DLLVM_TOOLCHAIN_PATH=$LLVM_TOOLCHAIN_PATH"
              -DCONFIG_MINIMAL_LIBC=y
              -DCONFIG_USE_SEGGER_RTT=n
              -DCONFIG_RTT_CONSOLE=n
            )
          fi

          west build -p always \
            -b "$BOARD" \
            -d "$build_dir" \
            samples/zigbee/zigbee_shell \
            -- "${cmake_args[@]}"

          config_file="$build_dir/zephyr/.config"
          grep -Fx "$ROLE_SYMBOL=y" "$config_file"
          if [[ "$ROLE" == coordinator ]]; then
            grep -Fx 'CONFIG_ZIGBEE_NCP_ZSTACK=y' "$config_file"
          fi
          if [[ "$ROLE" == coordinator && "$SOC" == nrf52840_nicenano ]]; then
            grep -Fx 'CONFIG_ZIGBEE_NCP_ZSTACK_PROMICRO_UF2=y' "$config_file"
          fi
          if [[ "$ROLE" == end-device && ( "$SOC" == tlsr8258 || "$SOC" == bl702 ) ]]; then
            grep -Fx 'CONFIG_PM=y' "$config_file"
            grep -Fx 'CONFIG_ZIGBEE_SLEEPY_DEEP=y' "$config_file"
          fi
          if [[ "$ROLE" == end-device && ( "$SOC" == nrf52840 || "$SOC" == nrf52840_nicenano ) ]]; then
            grep -Fx 'CONFIG_ZIGBEE_SLEEPY=y' "$config_file"
            grep -Fx 'CONFIG_ZIGBEE_SLEEPY_LIGHT=y' "$config_file"
            grep -Fx 'CONFIG_TICKLESS_KERNEL=y' "$config_file"
            grep -Fx 'CONFIG_NRF_RTC_TIMER=y' "$config_file"
          fi
          if [[ "$SOC" == esp32c6 || "$SOC" == esp32h2 ]]; then
            grep -Fx 'CONFIG_ZIGBEE_CHANNEL_MASK=0x800' "$config_file"
          else
            grep -Fx 'CONFIG_ZIGBEE_CHANNEL_MASK=0x07FFF800' "$config_file"
          fi
          if [[ "$SOC" == stm32wb55 ]]; then
            grep -Fx 'CONFIG_BOOTLOADER_MCUBOOT=y' "$config_file"
            grep -Fx 'CONFIG_IEEE802154_STM32WB=y' "$config_file"
          fi
          if [[ "$SOC" == ecb02c ]]; then
            grep -Fx 'CONFIG_BOOTLOADER_MCUBOOT=y' "$config_file"
            grep -Fx 'CONFIG_IEEE802154_PHY6252=y' "$config_file"
            # the USB-UART of the module is wired to UART1 with TX on P3 and RX on P2
            grep -Fx 'CONFIG_PHY6252_UART1_SWAP=y' "$config_file"
          fi
          if [[ "$ROLE" == coordinator && "$SOC" == ecb02c ]]; then
            grep -Fx 'CONFIG_ZIGBEE_NCP_ZSTACK_UART_IRQ=y' "$config_file"
          fi
          if [[ "$SOC" == tlsr8258 ]]; then
            grep -Fx 'CONFIG_MINIMAL_LIBC=y' "$config_file"
            ! grep -q '^CONFIG_USE_SEGGER_RTT=y$' "$config_file"
            ! grep -q '^CONFIG_RTT_CONSOLE=y$' "$config_file"
          fi

          ninja -C "$build_dir" ram_report
          cp "$config_file" "$RUNNER_TEMP/${SOC}-${ROLE}.config"

          firmware_name="${SOC}-${ROLE}.bin"
          if [[ "$SOC" == phy6252 ]]; then
            firmware="$build_dir/zephyr/zephyr.phy6252.bin"
          elif [[ "$SOC" == ecb02c ]]; then
            # MCUboot starts the signed application, which is the update image of the module
            firmware="$build_dir/zephyr/zephyr.signed.bin"
            firmware_name="${SOC}-${ROLE}-app.signed.bin"
          else
            firmware="$build_dir/zephyr/zephyr.bin"
          fi
          test -s "$firmware"
          mkdir -p "$RUNNER_TEMP/firmware"
          install -m 0644 "$firmware" \
            "$RUNNER_TEMP/firmware/$firmware_name"
          if [[ "$SOC" == nrf52840_nicenano ]]; then
            install -m 0644 "$build_dir/zephyr/zephyr.uf2" \
              "$RUNNER_TEMP/firmware/${SOC}-${ROLE}.uf2"
          fi

          if [[ "$SOC" == stm32wb55 ]]; then
            sample="$ZEPHYR_BASE/samples/zigbee/zigbee_shell"
            boot_dir="$RUNNER_TEMP/build-${SOC}-mcuboot"
            # MCUboot with serial recovery over USB, built for the same flash map as the
            # application and with the flash state fix of mcuboot/wbfix.
            west build -p always \
              -b "$BOARD" \
              -d "$boot_dir" \
              ../bootloader/mcuboot/boot/zephyr \
              -- \
              "-DEXTRA_CONF_FILE=$sample/mcuboot/weact_stm32wb55_core.conf" \
              "-DEXTRA_DTC_OVERLAY_FILE=$sample/mcuboot/weact_stm32wb55_core.overlay" \
              "-DZEPHYR_EXTRA_MODULES=$sample/mcuboot/wbfix"
            grep -Fx 'CONFIG_BOOT_SERIAL_CDC_ACM=y' "$boot_dir/zephyr/.config"

            # The signed application goes to the update tool as it is; the image with the
            # loader in front of it is for the first flashing, at 0x08000000.
            app="$build_dir/zephyr/zephyr.signed.bin"
            test -s "$app"
            install -m 0644 "$app" "$RUNNER_TEMP/firmware/${SOC}-${ROLE}-app.signed.bin"
            python - "$boot_dir/zephyr/zephyr.bin" "$app" \
              "$RUNNER_TEMP/firmware/${SOC}-${ROLE}.bin" <<'PY'
          import pathlib
          import sys

          # slot0_partition of boards/weact_stm32wb55_core.overlay
          SLOT0_OFFSET = 0x14000

          loader = pathlib.Path(sys.argv[1]).read_bytes()
          app = pathlib.Path(sys.argv[2]).read_bytes()
          if len(loader) > SLOT0_OFFSET:
              raise SystemExit(f"MCUboot of {len(loader)} bytes does not fit before the slot")
          # the initial stack pointer of MCUboot is in SRAM, the application starts with the
          # MCUboot image magic
          if loader[3] != 0x20 or app[:4] != bytes.fromhex("3db8f396"):
              raise SystemExit("unexpected MCUboot or application image")
          image = loader + b"\xff" * (SLOT0_OFFSET - len(loader)) + app
          pathlib.Path(sys.argv[3]).write_bytes(image)
          PY
          fi

          if [[ "$SOC" == ecb02c && "$ROLE" == coordinator ]]; then
            sample="$ZEPHYR_BASE/samples/zigbee/zigbee_shell"
            support="$ZEPHYR_BASE/boards/chinalctech/ecb02c/support"
            boot_dir="$RUNNER_TEMP/build-${SOC}-mcuboot"
            # MCUboot with the serial recovery on UART1 (P2/P3), for the flash map of the board
            west build -p always \
              -b "$BOARD" \
              -d "$boot_dir" \
              ../bootloader/mcuboot/boot/zephyr \
              -- \
              "-DEXTRA_CONF_FILE=$sample/mcuboot/ecb02c.conf" \
              "-DEXTRA_DTC_OVERLAY_FILE=$sample/mcuboot/ecb02c.overlay"
            grep -Fx 'CONFIG_BOOT_SERIAL_UART=y' "$boot_dir/zephyr/.config"
            grep -Fx 'CONFIG_PHY6252_UART1_SWAP=y' "$boot_dir/zephyr/.config"

            # The image for the first flashing: the boot ROM table and MCUboot at 0x2000 and the
            # signed coordinator in its slot at 0x18000; later images go to the serial recovery.
            (cd "$support" && python -m unittest test_merge_loader)
            python "$support/merge_loader.py" \
              "$boot_dir/zephyr/zephyr.phy6252.bin" \
              "$firmware" \
              "$RUNNER_TEMP/firmware/${SOC}-${ROLE}.bin"
          fi

          if [[ "$SOC" == bl702 ]]; then
            tool_root="$("$BFLB_MCU_TOOL_PYTHON" -c 'import pathlib, bflb_mcu_tool; print(pathlib.Path(bflb_mcu_tool.__file__).resolve().parent)')"
            # bflb-mcu-tool takes the flash from the packaged configuration, with
            # no option to override it. Select the KH25V80 (ID c22014) of the
            # board: the loader configuration names it, and the boot header must
            # not keep the default manufacturer ID 0xff, which makes the tool
            # leave the generic flash settings in place.
            "$BFLB_MCU_TOOL_PYTHON" - "$tool_root/chips/bl702" <<'PY'
          import configparser
          import pathlib
          import sys

          chip = pathlib.Path(sys.argv[1])


          def rewrite(name, section, option, value, destination=None):
              source = chip / name
              config = configparser.ConfigParser()
              if not config.read(source) or not config.has_section(section):
                  raise SystemExit(f"Missing BL702 configuration: {source}")
              config.set(section, option, value)
              with open(destination or source, "w", encoding="utf-8") as stream:
                  config.write(stream)


          rewrite("eflash_loader/eflash_loader_cfg.conf", "FLASH_CFG", "flash_id", "c22014",
                  chip / "eflash_loader/eflash_loader_cfg.ini")
          rewrite("efuse_bootheader/efuse_bootheader_cfg.conf", "BOOTHEADER_CFG", "mfg_id", "0xc2")
          PY
            "$RUNNER_TEMP/bflb-mcu-tool/bin/bflb-mcu-tool" \
              --chipname=bl702 \
              --xtal=32M \
              --firmware="$firmware" \
              --build

            bflb_firmware="$tool_root/chips/bl702/img_create_mcu/whole_img.bin"
            test -s "$bflb_firmware"
            "$BFLB_MCU_TOOL_PYTHON" - "$bflb_firmware" <<'PY'
          import pathlib
          import sys

          image = pathlib.Path(sys.argv[1]).read_bytes()
          if image[:4] != b"BFNP":
              raise SystemExit("BL702 BFLB image is missing the BFNP boot header")
          if image[0x19] != 0xC2:
              raise SystemExit("BL702 BFLB image does not carry the KH25V80 flash settings")
          PY
            install -m 0644 "$bflb_firmware" \
              "$RUNNER_TEMP/firmware/${SOC}-${ROLE}.bin"
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.soc }}-${{ matrix.role }}
          path: ${{ runner.temp }}/firmware/${{ matrix.soc }}-${{ matrix.role }}*
          if-no-files-found: error

      - name: Upload RAM report
        uses: actions/upload-artifact@v7
        with:
          name: memory-report-${{ matrix.soc }}-${{ matrix.role }}
          path: |
            ${{ runner.temp }}/build-${{ matrix.soc }}-${{ matrix.role }}/ram.json
            ${{ runner.temp }}/${{ matrix.soc }}-${{ matrix.role }}.config
            ${{ runner.temp }}/build-${{ matrix.soc }}-${{ matrix.role }}/zephyr/zephyr.map
          if-no-files-found: error

  stm32wb-coprocessor:
    name: stm32wb55 / coprocessor firmware
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Fetch the wireless coprocessor binaries of STM32CubeWB
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/STMicroelectronics/STM32CubeWB/archive/refs/tags/v${STM32CUBEWB_VERSION}.tar.gz"
          src='Projects/STM32WB_Copro_Wireless_Binaries/STM32WB5x'
          extract_dir="$RUNNER_TEMP/stm32cubewb"
          mkdir -p "$extract_dir" "$RUNNER_TEMP/firmware"
          # Only the two binaries are unpacked from the stream, not the whole release.
          curl --fail --location --retry 3 --retry-delay 2 "$url" |
            tar -xz -C "$extract_dir" --wildcards \
              "*/$src/stm32wb5x_Thread_RCP_fw.bin" \
              "*/$src/stm32wb5x_FUS_fw.bin"
          rcp="$(find "$extract_dir" -name stm32wb5x_Thread_RCP_fw.bin -print -quit)"
          fus="$(find "$extract_dir" -name stm32wb5x_FUS_fw.bin -print -quit)"
          test -s "$rcp"
          test -s "$fus"
          echo "$STM32WB_RCP_SHA256  $rcp" | sha256sum --check
          echo "$STM32WB_FUS_SHA256  $fus" | sha256sum --check
          # The radio driver talks to the Thread RCP firmware; the FUS is the updater the
          # firmware is installed with, in case the board has an older one.
          install -m 0644 "$rcp" "$RUNNER_TEMP/firmware/stm32wb55-copro-thread-rcp.bin"
          install -m 0644 "$fus" "$RUNNER_TEMP/firmware/stm32wb55-copro-fus.bin"

      - name: Upload coprocessor firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-stm32wb55-copro
          path: ${{ runner.temp }}/firmware/*.bin
          if-no-files-found: error

  publish-prerelease:
    name: Publish firmware prerelease
    needs:
      - build-firmware
      - stm32wb-coprocessor
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: release-artifacts
          merge-multiple: true

      - name: Set release tag and notes
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG_PREFIX}-$(date -u +%Y%m%d)-$(printf '%s' "$GITHUB_SHA" | cut -c1-6)"
          mapfile -t firmware_files < <(find release-artifacts -maxdepth 1 -type f -name '*.bin' | sort)
          # 24 images of the eight boards, the loader images and the update images of the
          # three STM32WB55 roles, the three update images of the ECB02C and its image with the
          # loader, the two coprocessor binaries
          if [[ "${#firmware_files[@]}" -ne 36 ]]; then
            echo "Expected thirty-six firmware files, found ${#firmware_files[@]}" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          cat > release-notes.md <<EOF
          Zigbee firmware prerelease for commit \`$GITHUB_SHA\`.

          Toolchains:
          - TLSR8258: TC32 LLVM \`$TC32_TOOLCHAIN_VERSION\`
          - nRF52840, EFR32MG21, STM32WBA, STM32WB55, ECB02C and PB-03F (PHY6252): Arm GNU Toolchain \`$ARM_GNU_TOOLCHAIN_VERSION\`
          - ESP32-C6, ESP32-H2 and BL702: Zephyr SDK with the RISC-V toolchain

          The release contains router, end-device, and coordinator images for TLSR8258,
          nRF52840, ESP32-C6, ESP32-H2, and BL702 (dt_xt_zb1_devkit), and router, end-device,
          and coordinator images for EFR32MG21 (slwrb4180a), STM32WBA55 (nucleo_wba55cg) and
          Ai-Thinker PB-03F (PHY6252).
          The release also has router, end-device, and coordinator images for the WeAct
          STM32WB55 core board (weact_stm32wb55_core). \`stm32wb55-<role>.bin\` is MCUboot
          (serial recovery over USB CDC ACM) and the application in one image. Flash it
          at 0x08000000 through the ROM DFU bootloader (BOOT button held while the board
          is reset), for example with
          \`dfu-util -a 0 -s 0x08000000:leave -D stm32wb55-<role>.bin\`.
          \`stm32wb55-<role>-app.signed.bin\` is the application alone, for an update over
          the second USB serial port (mcumgr, within 5 s after a reset). The coordinator
          is a USB dongle for the Z-Stack host: its first USB serial port carries the host
          protocol.
          CPU2 must run the Thread RCP firmware: install
          \`stm32wb55-copro-thread-rcp.bin\` at 0x080DF000 (1 MiB parts) with the FUS, for
          example with STM32CubeProgrammer, as described in the release notes of
          STM32CubeWB. \`stm32wb55-copro-fus.bin\` is the FUS of that release. Both come
          unmodified from STM32CubeWB v$STM32CUBEWB_VERSION and are licensed by
          STMicroelectronics for use on its devices.
          The release also has router, end-device, and coordinator images for the ECB02C
          (PHY6222). \`ecb02c-coordinator.bin\` is MCUboot (serial recovery on UART1 of the
          module, P2 and P3) and the coordinator in one image, for the first flashing only:
          connect a USB-UART to P9 and P10 and write it through the boot ROM at 0x11002000, for
          example with \`rdwr_phy62x2.py -p <port> -r we 0x11002000 ecb02c-coordinator.bin\` of
          the PHY62x2 utilities, then use the USB-UART of the module. \`ecb02c-<role>-app.signed.bin\`
          is the application alone, for the serial recovery of MCUboot (mcumgr, within 3 s after
          a reset; the coordinator restarts into it with SYS_RESET_REQ type 0).
          The BL702 `.bin` files include the native BFNP boot header and can be programmed over UART
          with `bflb-mcu-tool` (`--chipname=bl702 --xtal=32M`).
          The coordinators speak the Z-Stack ZNP protocol, for Zigbee2MQTT (adapter: zstack)
          and ZHA.
          The end devices for TLSR8258 and BL702 deep sleep between parent polls. The nRF52840
          end device uses System ON sleep with RTC wakeup and retains RAM.
          EOF
          printf '%s\n' "${firmware_files[@]}"

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.release.outputs.tag }}'
          repo="$GITHUB_REPOSITORY"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$repo" \
              --title "$tag" \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "$tag" release-artifacts/*.bin --repo "$repo" --clobber
          else
            gh release create "$tag" release-artifacts/*.bin \
              --repo "$repo" \
              --title "$tag" \
              --notes-file release-notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
