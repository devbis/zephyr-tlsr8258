sample:
  name: TLSR8258 suspend with timer wakeup
tests:
  sample.boards.telink.tlsr8258_pm_timer:
    platform_allow:
      - tlsr8258_generic
      - tlsr8258_tb03f
    tags:
      - telink
      - pm
    harness: console
    harness_config:
      type: one_line
      regex:
        - "woke up, reason timer"
