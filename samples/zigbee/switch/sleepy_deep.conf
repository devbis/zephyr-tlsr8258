# Battery powered switch: deep sleep between the parent polls, ended early by a
# button that is a wakeup source. Every wakeup restarts the firmware.
CONFIG_PM=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_ZIGBEE_SLEEPY_DEEP=y
