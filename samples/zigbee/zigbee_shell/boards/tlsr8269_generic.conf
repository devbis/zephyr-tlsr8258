CONFIG_IEEE802154_TELINK_TLSR8269=y
# The boot mirror holds the vectors, .boot_ram_mirror, .ram_code and the
# instruction cache scratch area; it defaults to 0x2000 on TLSR82xx.
CONFIG_TC32_BOOT_MIRROR_SIZE=0x2000
CONFIG_LOG=n
CONFIG_TIMESLICING=n
CONFIG_TICKLESS_KERNEL=n
# RAM budget: 32 KB SRAM minus the 8 KB boot mirror. Stacks trimmed for ED.
CONFIG_ZIGBEE_STACK_SIZE=1536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
CONFIG_MAIN_STACK_SIZE=640
CONFIG_IDLE_STACK_SIZE=512
