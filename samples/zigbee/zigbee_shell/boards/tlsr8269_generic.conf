CONFIG_IEEE802154_TELINK_TLSR8269=y
# The boot mirror holds the vectors, .boot_ram_mirror, .ram_code and the
# instruction cache scratch area. The linker asserts the minimum (ram_code
# rounded up to 256 bytes plus 0x900), 0x1100 for this image; the vendor
# 826x link file reserves the same area and starts .data right after it.
CONFIG_TC32_BOOT_MIRROR_SIZE=0x1100
CONFIG_LOG=n
CONFIG_TIMESLICING=n
CONFIG_TICKLESS_KERNEL=n
# RAM budget: 32 KB SRAM minus the 4.25 KB boot mirror. Sizes below come from
# high-water marks measured over a join and interview in mcuemu (stacks
# filled with 0xaa, peak queue fill), with 25-50% headroom on top.
CONFIG_LOG=n
CONFIG_TIMESLICING=n
CONFIG_TICKLESS_KERNEL=n
# Measured: zb thread 884 bytes, RX thread 488, work queue 200, idle 60,
# main 544, interrupts 216.
# The Zigbee loop runs in main() and drains the radio itself, so the Zigbee
# and RX threads (two stacks, two thread objects) are not created.
CONFIG_ZIGBEE_RUN_IN_MAIN=y
CONFIG_IEEE802154_TLSR8269_RX_THREAD=n
CONFIG_MAIN_THREAD_PRIORITY=5
CONFIG_MAIN_STACK_SIZE=1152
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=384
CONFIG_IDLE_STACK_SIZE=256
CONFIG_ISR_STACK_SIZE=512
# Measured peak fill: callback queue 1, RX callback queue 0, layer queues 2
# (MAC to NWK) and 1, L2 queue 2, driver RX queue 1.
CONFIG_ZIGBEE_TASKQ_DEPTH=8
CONFIG_ZIGBEE_TASKQ_RX_DEPTH=8
CONFIG_ZIGBEE_CALLBACK_QUEUE_DEPTH=16
# One frame is in flight at a time in each direction: the RX thread hands a
# frame to the L2 inline and the TX path is synchronous.
CONFIG_NET_PKT_RX_COUNT=1
CONFIG_NET_PKT_TX_COUNT=1
CONFIG_NET_BUF_RX_COUNT=1
CONFIG_NET_BUF_TX_COUNT=1
