CONFIG_ZIGBEE_CHANNEL_MASK=0x800
CONFIG_COUNTER=y
CONFIG_PM_DEVICE=y

# The PHY's full calibration is about 1440 bytes deep; the 896-byte stack of prj.conf overruns into
# the idle thread's initial frame and the board resets in a loop.
CONFIG_MAIN_STACK_SIZE=2048
