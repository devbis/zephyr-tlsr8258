CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# "kernel reboot cold" lets the flashing scripts restart the board into MCUboot or the boot ROM
CONFIG_SHELL=y
CONFIG_SHELL_MINIMAL=y
CONFIG_KERNEL_SHELL=y

# MCUboot with one application slot starts the application
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_BOOTLOADER_MODE_SINGLE_APP=y
CONFIG_MCUBOOT_GENERATE_UNSIGNED_IMAGE=y
