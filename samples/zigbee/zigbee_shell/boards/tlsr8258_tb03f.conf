CONFIG_IEEE802154_TELINK_TLSR8258=y
CONFIG_ZIGBEE_STACK_SIZE=6144
CONFIG_STACK_SENTINEL=y
# The boot mirror holds the vectors, .boot_ram_mirror, .ram_code (including
# the flash write and erase paths) and the instruction cache scratch area.
CONFIG_TC32_BOOT_MIRROR_SIZE=0x4000
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=1
CONFIG_SEGGER_RTT_MAX_NUM_DOWN_BUFFERS=1
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=16
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_TIMESLICING=n
CONFIG_TICKLESS_KERNEL=n
