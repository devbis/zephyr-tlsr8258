CONFIG_IEEE802154_TELINK_TLSR8258=y
CONFIG_ZIGBEE_STACK_SIZE=2048
CONFIG_TC32_BOOT_MIRROR_SIZE=0xB000
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_TLSR8258_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_TIMESLICING=n
CONFIG_TICKLESS_KERNEL=n
# TLSR8258 Zigbee bring-up still hangs in Zephyr NVS mount; run without persistence.
CONFIG_ZIGBEE_NV_FLASH_AREA_ID=255
