CONFIG_IEEE802154_TELINK_TLSR8258=y
CONFIG_ZIGBEE_STACK_SIZE=2048
# Boot-mirror reserve: _tc32_boot_mirror_runtime_min_ = boot-copy area (vectors
# + .boot_ram_mirror + .ram_code) + TC32_BOOT_ICACHE_SCRATCH_SIZE (0x900).
# After adding .ram_code with tlsr8258_rf_isr, runtime min is ~0x1400 (5 KB).
# Round up to 0x2000 for a bit of growth headroom in .ram_code; the linker
# assert will catch overflow.
CONFIG_TC32_BOOT_MIRROR_SIZE=0x2000
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_TLSR8258_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_TIMESLICING=n
CONFIG_TICKLESS_KERNEL=n
# Use the board's nvs_storage partition for Zigbee persistence.
CONFIG_ZIGBEE_NV_FLASH_AREA_ID=-1
