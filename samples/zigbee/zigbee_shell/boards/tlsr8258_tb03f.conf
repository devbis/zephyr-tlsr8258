CONFIG_IEEE802154_TELINK_TLSR8258=y
CONFIG_ZIGBEE_STACK_SIZE=4096
# Boot-mirror reserve: _tc32_boot_mirror_runtime_min_ = boot-copy area (vectors
# + .boot_ram_mirror + .ram_code) + TC32_BOOT_ICACHE_SCRATCH_SIZE (0x900).
# Flash hardening commits 524b145/4ebe8c5/3a4f314 grew .ram_code with the
# __ramfunc flash write/erase paths beyond the old 0x2000 budget; bump to
# 0x4000 to fit both .ram_code and the icache scratch. The linker assert
# on _tc32_boot_mirror_runtime_min_ will catch any future overflow.
CONFIG_TC32_BOOT_MIRROR_SIZE=0x4000
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_TLSR8258_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_TIMESLICING=n
CONFIG_TICKLESS_KERNEL=n
# Use the board's zigbee_nv_partition for Zigbee persistence.
