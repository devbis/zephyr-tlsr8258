# The image is signed for the MCUboot that is already on the gateway, which swaps it in from the
# update slot.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-ec-p256.pem"
CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_SCRATCH=y
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="2.9.3+0"
