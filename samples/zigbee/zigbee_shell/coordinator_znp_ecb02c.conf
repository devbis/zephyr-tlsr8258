# The console UART is the host UART: no shell and no log on it
CONFIG_SHELL=n
CONFIG_KERNEL_SHELL=n

# The UART has a 16-byte receive FIFO: collect the requests in the interrupt
CONFIG_ZIGBEE_NCP_ZSTACK_UART_IRQ=y
