# A coordinator that a Z-Stack host (Zigbee2MQTT, ZHA) drives over the UART
# the board overlay names as zigbee,ncp-uart.
CONFIG_ZIGBEE_COORDINATOR=y
CONFIG_ZIGBEE_NCP=y
CONFIG_ZIGBEE_NCP_ZSTACK=y
CONFIG_ZIGBEE_STACK_SIZE=4096
