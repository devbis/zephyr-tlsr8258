# A coordinator that a Z-Stack host (Zigbee2MQTT, ZHA) drives over the UART
# the board overlay names as zigbee,ncp-uart.
CONFIG_ZIGBEE_COORDINATOR=y
CONFIG_ZIGBEE_NCP=y
CONFIG_ZIGBEE_NCP_ZSTACK=y
# Nothing but the protocol may use the host UART.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
# Keep SRAM available for the TLSR8258 radio and packet buffers.
CONFIG_ZIGBEE_STACK_SIZE=3072
