# The UART has a 16-byte receive FIFO: collect the requests in the interrupt
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_ZIGBEE_NCP_ZSTACK_UART_IRQ=y

# The Z-Stack protocol runs on the Zigbee thread together with the stack.
CONFIG_ZIGBEE_STACK_SIZE=4096
