# TLSR8269 router: add to router.conf and the board config
# (-DEXTRA_CONF_FILE="router.conf;router_tlsr8269.conf"). A router has more
# frames in flight than the end device the board config is sized for, in 32 KB
# of SRAM.
# The main thread peaked at 1012 bytes joining and exchanging data.
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_ZIGBEE_TASKQ_DEPTH=16
CONFIG_ZIGBEE_TASKQ_RX_DEPTH=32
CONFIG_ZIGBEE_CALLBACK_QUEUE_DEPTH=32
# The vendor router has 36 buffers of 208 bytes; a buffer here is the same
# 208 bytes, and the 128 byte copy of a received frame comes from a pool of
# its own, as few frames are held at a time.
CONFIG_ZIGBEE_BUF_POOL_NUM=24
CONFIG_ZIGBEE_RX_SNAPSHOTS=4
