sample:
  name: Zigbee end device or router
common:
  build_only: true
  platform_allow:
    - tlsr8258_tb03f
    - nrf52840dk/nrf52840
    - esp32c6_devkitc/esp32c6/hpcore
    - esp32h2_devkitm/esp32h2
    - slwrb4180a
    - dt_xt_zb1_devkit
    - nucleo_wba55cg
    - weact_stm32wb55_core
  tags:
    - zigbee
tests:
  sample.zigbee.node.end_device: {}
  sample.zigbee.node.end_device.promicro:
    platform_allow:
      - promicro_nrf52840/nrf52840/uf2
    integration_platforms:
      - promicro_nrf52840/nrf52840/uf2
  sample.zigbee.node.end_device.promicro_usb:
    platform_allow:
      - promicro_nrf52840/nrf52840/uf2
    integration_platforms:
      - promicro_nrf52840/nrf52840/uf2
    extra_args:
      - EXTRA_CONF_FILE="promicro_usb_shell.conf;promicro_ed_usb.conf"
      - EXTRA_DTC_OVERLAY_FILE="promicro_nosd.overlay;promicro_ed_usb.overlay"
  sample.zigbee.node.router.promicro_usb:
    platform_allow:
      - promicro_nrf52840/nrf52840/uf2
    integration_platforms:
      - promicro_nrf52840/nrf52840/uf2
    extra_args:
      - EXTRA_CONF_FILE="router.conf;promicro_usb_shell.conf"
      - EXTRA_DTC_OVERLAY_FILE=promicro_nosd.overlay
      - CONFIG_ZIGBEE_STACK_SIZE=4096
  sample.zigbee.node.coordinator_znp.promicro_usb:
    platform_allow:
      - promicro_nrf52840/nrf52840/uf2
    integration_platforms:
      - promicro_nrf52840/nrf52840/uf2
    extra_args:
      - EXTRA_CONF_FILE="coordinator_znp.conf;promicro_znp_usb.conf"
      - EXTRA_DTC_OVERLAY_FILE="promicro_nosd.overlay;promicro_znp_usb.overlay"
  sample.zigbee.node.router:
    extra_args:
      - EXTRA_CONF_FILE=router.conf
  sample.zigbee.node.coordinator_znp.esp32c6:
    platform_allow:
      - esp32c6_devkitc/esp32c6/hpcore
    integration_platforms:
      - esp32c6_devkitc/esp32c6/hpcore
    extra_args:
      - EXTRA_CONF_FILE=coordinator_znp.conf
  sample.zigbee.node.router.ota:
    platform_allow:
      - tlsr8258_tb03f
    integration_platforms:
      - tlsr8258_tb03f
    extra_args:
      - EXTRA_CONF_FILE="router.conf;ota.conf"
      - SNIPPET=tlsr8258-mcuboot
  sample.zigbee.node.router.on_off:
    platform_allow:
      - tlsr8258_tb03f
    integration_platforms:
      - tlsr8258_tb03f
    extra_args:
      - EXTRA_CONF_FILE="router.conf;on_off.conf"
  sample.zigbee.node.router.gp_sink:
    platform_allow:
      - tlsr8258_tb03f
    integration_platforms:
      - tlsr8258_tb03f
    extra_args:
      - EXTRA_CONF_FILE="router.conf;gp_sink.conf"
  sample.zigbee.node.router.wwah:
    platform_allow:
      - tlsr8258_tb03f
    integration_platforms:
      - tlsr8258_tb03f
    extra_args:
      - EXTRA_CONF_FILE="router.conf;wwah.conf"
