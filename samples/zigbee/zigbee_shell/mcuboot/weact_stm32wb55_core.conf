# MCUboot for the WeAct STM32WB55 core board. Build it from bootloader/mcuboot/boot/zephyr with
# this file as EXTRA_CONF_FILE, mcuboot/weact_stm32wb55_core.overlay as EXTRA_DTC_OVERLAY_FILE
# and mcuboot/wbfix as ZEPHYR_EXTRA_MODULES.

# Serial recovery over USB CDC ACM. The BOOT button is the BOOT0 pin of the chip, so it cannot
# request the recovery: the loader waits for an upload for 5 s after every reset, and stays
# when there is no application.
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_GPIO=y
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=5000
CONFIG_MULTITHREADING=y

# The slot is overwritten by the upload: there is no swap and no scratch area
CONFIG_BOOT_UPGRADE_ONLY=y

# The user LED is on while the loader waits
CONFIG_MCUBOOT_INDICATION_LED=y
