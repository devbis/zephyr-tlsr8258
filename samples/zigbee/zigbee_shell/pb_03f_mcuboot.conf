# The application of the PB-03F that MCUboot starts from slot 0 and swaps with slot 1 (OTA).
# Use with -DEXTRA_DTC_OVERLAY_FILE=$ZEPHYR_BASE/samples/zigbee/zigbee_shell/pb_03f_mcuboot.overlay
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_MOVE=y
CONFIG_MCUBOOT_GENERATE_UNSIGNED_IMAGE=y
