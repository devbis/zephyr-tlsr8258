# Sleepy end device that enters deep sleep between parent polls. Every wake is
# a reset, so the boot, NV restore and radio bring-up time is paid per poll.
CONFIG_PM=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_ZIGBEE_SLEEPY_DEEP=y
