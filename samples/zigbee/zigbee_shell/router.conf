CONFIG_ZIGBEE_ROUTER=y
# Step 0 diagnostic gate (see zephyr-docs/router-rx-queue-starvation-2026-06-20.md).
# THREAD_RUNTIME_STATS lets us measure how much CPU the RX worker actually
# accumulates vs how long it sits blocked. SCHED_THREAD_USAGE adds the
# per-thread accounting fields. TIMING_FUNCTIONS is the timer backend.
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y

# Re-interview wedge (2026-07-28): the zb_thread crashed into its own stack under
# the coordinator's re-interview retransmit burst (deep RX->MAC->NWK->APS->ZDP->CCM
# dispatch chain), with no overflow detection so it wedged silently. Enable the
# stack sentinel to turn a silent wedge into a clean fatal, and grow the zb_thread
# stack from the 4096 default. RAM for the extra stack comes from trimming the
# zb_buf pool 36->24 (see zb_common_stub.h).
CONFIG_STACK_SENTINEL=y
CONFIG_ZIGBEE_STACK_SIZE=6144
