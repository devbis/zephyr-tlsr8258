# Sleepy end device that suspends between parent polls: RAM is retained and
# execution resumes in place, so no reboot, NV read or rejoin is involved.
CONFIG_PM=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_ZIGBEE_SLEEPY_LIGHT=y
